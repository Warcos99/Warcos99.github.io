<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>[INSERT TITLE]</title>
        <!--- insert title --->
        <link rel="stylesheet" href="/Assets/Styles/fonts.css" />
        <link rel="stylesheet" href="/Assets/Styles/style.css" />
        <link rel="stylesheet" href="/Assets/Styles/navbar.css" />
    </head>
    <body>
        <div id="header"></div>
        <div class="content">
            <div id="[INSERT ID FOR PAGE]"></div>
            <!--- insert ID if loading from loadcontent. otherwise remove this line and build your own html --->
        </div>

        
        <!--to convert markdown into html -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <!--to load markdown files -->
        <script src="/Assets/Scripts/loadcontent.js"></script>
        <!--clicking on images lightbox -->
        <script src="/Assets/Scripts/lightbox.js"></script>
        <!--to load header html file-->
        <script>
          fetch("/header.html")
            .then(response => response.text())
            .then(html => {
              document.getElementById("header").innerHTML = html;
            });
        </script>
    </body>
